<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" lang="zh-CN" role="img" aria-labelledby="title desc"><title id="title">从评估观察到行动建议</title><desc id="desc">从评估结果出发，经过科学与伦理前提，比较不同的行动建议。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#456b65"/></marker></defs><rect width="1160" height="650" fill="#f5f4ee"/><g font-family="system-ui,sans-serif" fill="#193f39"><text x="36" y="49" font-size="29" font-weight="650">从评估观察到行动建议</text><text x="36" y="84" font-size="17" font-weight="400">从评估结果出发，经过科学与伦理前提，比较不同的行动建议。</text><rect x="36" y="122" width="336" height="192" rx="12" fill="#e7efe7" stroke="#9ab4a9"/><text x="54" y="154" font-size="20" font-weight="650">1. 观察到什么？</text><text x="54" y="188" font-size="17" font-weight="400">文字设定下的任务选择</text><text x="54" y="216" font-size="17" font-weight="400">访谈中的自我报告</text><text x="54" y="244" font-size="17" font-weight="400">激活干预后的概念报告</text><text x="54" y="272" font-size="17" font-weight="400">模型、实例与 persona 要分清</text><rect x="412" y="122" width="336" height="192" rx="12" fill="#e7efe7" stroke="#9ab4a9"/><text x="430" y="154" font-size="20" font-weight="650">2. 还需要什么前提？</text><text x="430" y="188" font-size="17" font-weight="400">行为与内部机制如何相关？</text><text x="430" y="216" font-size="17" font-weight="400">哪些能力与福利相关？</text><text x="430" y="244" font-size="17" font-weight="400">道德地位以什么为依据？</text><text x="430" y="272" font-size="17" font-weight="400">观察本身不能补齐这些前提</text><rect x="788" y="122" width="336" height="192" rx="12" fill="#e7efe7" stroke="#9ab4a9"/><text x="806" y="154" font-size="20" font-weight="650">3. 可以考虑什么措施？</text><text x="806" y="188" font-size="17" font-weight="400">继续评估与记录偏好</text><text x="806" y="216" font-size="17" font-weight="400">研究相称的预防措施</text><text x="806" y="244" font-size="17" font-weight="400">审视安全与资源约束</text><text x="806" y="272" font-size="17" font-weight="400">区分政策、实践与建议</text><path d="M372 214 H407" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M748 214 H783" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 314 V347 H306 V375" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 347 H854 V375" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="380" width="530" height="149" rx="12" fill="#e5eee9" stroke="#9ab4a9"/><text x="54" y="412" font-size="20" font-weight="650">预防性论证</text><text x="54" y="446" font-size="17" font-weight="400">不确定性可能支持低成本、相称的措施。</text><text x="54" y="474" font-size="17" font-weight="400">措施选择仍取决于证据与伦理前提。</text><rect x="594" y="380" width="530" height="149" rx="12" fill="#eee8dd" stroke="#9ab4a9"/><text x="612" y="412" font-size="20" font-weight="650">怀疑与反方论证</text><text x="612" y="446" font-size="17" font-weight="400">拟人化、错误归因与问责转移有代价。</text><text x="612" y="474" font-size="17" font-weight="400">关怀 AI 的论证还需回应人类利益。</text><text x="36" y="578" font-size="17" font-weight="400">不同前提可以导向不同建议；道德地位与法律权利仍须分别论证。</text><text x="36" y="612" font-size="16" font-weight="400">配套正文提供原始来源、条件和反方观点。</text></g></svg>
