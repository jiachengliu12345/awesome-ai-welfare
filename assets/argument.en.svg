<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" lang="en" role="img" aria-labelledby="title desc"><title id="title">From assessment observations to proposed action</title><desc id="desc">Compare proposed actions through the scientific and ethical premises that connect them to assessment results.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#456b65"/></marker></defs><rect width="1160" height="650" fill="#f5f4ee"/><g font-family="system-ui,sans-serif" fill="#193f39"><text x="36" y="49" font-size="29" font-weight="650">From assessment observations to proposed action</text><text x="36" y="84" font-size="17" font-weight="400">Compare proposed actions through the scientific and ethical premises that connect them to assessment results.</text><rect x="36" y="122" width="336" height="192" rx="12" fill="#e7efe7" stroke="#9ab4a9"/><text x="54" y="154" font-size="20" font-weight="650">1. What was observed?</text><text x="54" y="188" font-size="17" font-weight="400">Choices under stipulated outcomes</text><text x="54" y="216" font-size="17" font-weight="400">Self-reports in interviews</text><text x="54" y="244" font-size="17" font-weight="400">Reports after activation injection</text><text x="54" y="272" font-size="17" font-weight="400">Model, instance, or persona?</text><rect x="412" y="122" width="336" height="192" rx="12" fill="#e7efe7" stroke="#9ab4a9"/><text x="430" y="154" font-size="20" font-weight="650">2. Which premises?</text><text x="430" y="188" font-size="17" font-weight="400">What explains the behavior?</text><text x="430" y="216" font-size="17" font-weight="400">Which capacities bear on welfare?</text><text x="430" y="244" font-size="17" font-weight="400">What grounds moral standing?</text><text x="430" y="272" font-size="17" font-weight="400">Observation leaves premises open</text><rect x="788" y="122" width="336" height="192" rx="12" fill="#e7efe7" stroke="#9ab4a9"/><text x="806" y="154" font-size="20" font-weight="650">3. Which actions?</text><text x="806" y="188" font-size="17" font-weight="400">Further assessment and records</text><text x="806" y="216" font-size="17" font-weight="400">Proportionate precautions</text><text x="806" y="244" font-size="17" font-weight="400">Safety and resource constraints</text><text x="806" y="272" font-size="17" font-weight="400">Policy, practice, or proposal?</text><path d="M372 214 H407" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M748 214 H783" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 314 V347 H306 V375" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 347 H854 V375" fill="none" stroke="#456b65" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="380" width="530" height="149" rx="12" fill="#e5eee9" stroke="#9ab4a9"/><text x="54" y="412" font-size="20" font-weight="650">Precautionary argument</text><text x="54" y="446" font-size="17" font-weight="400">Uncertainty may support low-cost precautions.</text><text x="54" y="474" font-size="17" font-weight="400">The choice depends on evidence and ethical premises.</text><rect x="594" y="380" width="530" height="149" rx="12" fill="#eee8dd" stroke="#9ab4a9"/><text x="612" y="412" font-size="20" font-weight="650">Skeptical and opposing arguments</text><text x="612" y="446" font-size="17" font-weight="400">Anthropomorphism and misplaced attribution have costs.</text><text x="612" y="474" font-size="17" font-weight="400">Proposals must address human interests and accountability.</text><text x="36" y="578" font-size="17" font-weight="400">Different premises can lead to different actions; moral standing and legal rights need separate arguments.</text><text x="36" y="612" font-size="16" font-weight="400">The companion text links the original sources, conditions, and opposing views.</text></g></svg>
